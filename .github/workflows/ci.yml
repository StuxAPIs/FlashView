name: CI

# Runs the checks on pushes to main and test, and on every pull request (a pull request from test into
# main needs this to pass before it is merged).
on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/version.sh reads the tags
      - run: node tests/pages.js
      - name: Pages match scripts/build-pages.py
        run: python3 -I scripts/build-pages.py --check
      - run: bash tests/version.sh
      - name: Pinned Ruffle downloads and matches its SHA-256
        run: bash scripts/fetch-ruffle.sh
      - name: Shell scripts pass shellcheck
        run: shellcheck commit.sh dev-server.sh scripts/*.sh tests/*.sh
